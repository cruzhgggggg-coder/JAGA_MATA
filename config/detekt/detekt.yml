# Detekt config — JagaMata
# Build-upon default config; disesuaikan untuk idiom Jetpack Compose & layout DSL.

build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 500
  CyclomaticComplexMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 20
    constructorThreshold: 20
  TooManyFunctions:
    thresholdInFiles: 40
    thresholdInClasses: 40
    thresholdInObjects: 40
    thresholdInInterfaces: 40

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 6
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  UnusedPrivateProperty:
    active: false
  UnusedParameter:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  MaxLineLength:
    maxLineLength: 220
  WildcardImport:
    active: true
