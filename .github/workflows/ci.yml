name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit test
        run: ./gradlew testDebugUnitTest --console=plain

      - name: ktlint
        run: ./gradlew ktlintCheck --console=plain

      - name: detekt
        run: ./gradlew detekt --console=plain

      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

      - name: KPI metrics (fixture)
        run: |
          python3 ml/metrics.py \
            --labels ml/ground_truth/fixture_labels.csv \
            --predictions ml/ground_truth/fixture_predictions.csv \
            --out /tmp/k1_k2_k3.txt
          cat /tmp/k1_k2_k3.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
